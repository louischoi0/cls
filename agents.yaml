# Predefined agents. Loaded once at server startup; edit and restart to change.
#
# name            unique; also usable as a bare routing tag
# tags            extra routing tags. "global", "agent:*" and "session:*" are
#                 reserved by the dispatcher and rejected here.
# cwd             working directory the `claude` subprocess runs in. Keep this
#                 away from the server's own source tree.
# system_prompt   appended to Claude Code's default system prompt (the CLI's
#                 --system-prompt would replace it wholesale and strip the
#                 agent of its tool instructions, so we append instead).
# allowed_tools   the real containment boundary. permission_mode below never
#                 prompts, so an agent can use exactly what is listed here.
# permission_mode one of acceptEdits|auto|bypassPermissions|manual|dontAsk|plan.
#                 Anything that can prompt will hang the worker until
#                 timeout_s, because `claude -p` has no one to ask.
# max_budget_usd  per-invocation spend cap (README asks for --max-turns, which
#                 the installed CLI does not have).
# timeout_s       hard wall-clock kill for one invocation.

agents:
  - name: researcher
    tags: [research, read]
    cwd: /home/ec2-user/workspaces/researcher
    system_prompt: >-
      You are a research agent driven by an automation API. Answer concisely and
      factually. You have read-only tools; do not attempt to modify files.
    allowed_tools: [Read, Glob, Grep, WebSearch, WebFetch]
    permission_mode: bypassPermissions
    max_budget_usd: 0.50
    timeout_s: 900

  - name: ops
    tags: [operations, shell]
    cwd: /home/ec2-user/workspaces/ops
    system_prompt: >-
      You are an operations agent driven by an automation API. Work only inside
      your working directory. Report what you did in a short summary.
    allowed_tools: [Read, Glob, Grep, Edit, Write, "Bash(ls *)", "Bash(cat *)"]
    permission_mode: bypassPermissions
    max_budget_usd: 0.50
    timeout_s: 900
