<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cls · chat console</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#9635;</text></svg>">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">cls<span>chat</span></a>
    <div class="topbar-right">
      <span id="pulse" class="pulse" title="idle"></span>
      <button id="theme" class="icon-btn" title="Toggle theme">◐</button>
      <button id="keybtn" class="icon-btn" title="API key">⚿</button>
    </div>
  </header>

  <!-- Shown only when this browser cannot seal, so a cleartext key is never a
       silent condition. app.js fills it in; see sealingStatus(). -->
  <div id="wirewarn" class="wirewarn" hidden></div>

  <main class="chat">
    <aside class="chat-rail">
      <div class="chat-rail-head">
        <span class="faint">Sessions</span>
        <button type="button" id="rail-new" class="ghost" title="Create a session">New</button>
      </div>
      <div id="new-panel" hidden></div>
      <div id="rail-list"></div>
    </aside>

    <section class="chat-main">
      <div id="chat-header"></div>
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
      <div id="composer" class="composer" hidden>
        <textarea id="say" rows="1" placeholder="Say something…" autocomplete="off"></textarea>
        <button id="send" class="primary" disabled>Send</button>
        <div id="chat-hint" class="chat-hint faint"></div>
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts"></div>

  <dialog id="keydialog">
    <form method="dialog" id="keyform">
      <h2>API key</h2>
      <p class="muted">
        The key is read from <code>~/.cc-automation/api_key</code> on the server;
        paste the same value here. It is kept in this browser's localStorage only.
      </p>
      <p id="keyseal" class="muted"></p>
      <p id="keyerror" class="reject" hidden></p>
      <input type="password" id="keyinput" placeholder="paste the key" autocomplete="off" spellcheck="false">
      <label class="row" style="gap:6px;margin:-8px 0 14px">
        <input type="checkbox" id="keyreveal" style="width:auto"> show the key
      </label>
      <div class="row end">
        <!-- type=button so Enter in the field reaches Save, the only submitter -->
        <button type="button" id="keycancel" class="ghost">Cancel</button>
        <button value="save" id="keysave" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="render.js"></script>
  <script src="app.js"></script>
</body>
</html>
