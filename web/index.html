<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cls · chat console</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#9635;</text></svg>">
</head>
<body>
  <!-- One screen, edge to edge. The transcript takes the whole viewport minus
       the prompt box and the status line; nothing else competes for the space. -->
  <div class="term">
    <aside class="rail" id="rail">
      <div class="rail-head">
        <span class="rail-title">sessions</span>
        <button type="button" id="rail-new" class="icon-btn" title="New session" aria-label="New session">+</button>
      </div>
      <div id="new-panel" hidden></div>
      <div id="rail-list" class="rail-list"></div>
    </aside>

    <main class="term-main">
      <div id="chat-header"></div>
      <div id="chat-log" class="term-log" aria-live="polite"></div>

      <!-- The CLI's prompt box: a bordered field with the caret inside it, the
           hint underneath, and nothing between it and the bottom of the pane. -->
      <div id="composer" class="prompt-box" hidden>
        <div class="prompt-field">
          <span class="prompt-ps" aria-hidden="true">&gt;</span>
          <textarea id="say" rows="1" placeholder="ask anything" autocomplete="off" spellcheck="false"></textarea>
          <button id="send" class="icon-btn send" title="Send" aria-label="Send" disabled>⏎</button>
        </div>
        <div id="chat-hint" class="prompt-hint"></div>
      </div>
    </main>
  </div>

  <div class="statusline">
    <button type="button" id="rail-toggle" class="icon-btn" title="Toggle sessions (Ctrl+B)" aria-label="Toggle sessions">▚</button>
    <div id="status-left" class="status-left"></div>
    <div class="status-right">
      <span id="pulse" class="pulse" title="idle"></span>
      <button id="theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
      <button id="keybtn" class="icon-btn" title="API key" aria-label="API key">⚿</button>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>

  <dialog id="keydialog">
    <form method="dialog" id="keyform">
      <h2>API key</h2>
      <p class="muted">
        The key is read from <code>~/.cc-automation/api_key</code> on the server;
        paste the same value here. It is kept in this browser's localStorage only.
      </p>
      <p id="keyseal" class="muted"></p>
      <p id="keyerror" class="reject" hidden></p>
      <input type="password" id="keyinput" placeholder="paste the key" autocomplete="off" spellcheck="false">
      <label class="row" style="gap:6px;margin:-8px 0 14px">
        <input type="checkbox" id="keyreveal" style="width:auto"> show the key
      </label>
      <div class="row end">
        <!-- type=button so Enter in the field reaches Save, the only submitter -->
        <button type="button" id="keycancel" class="ghost">Cancel</button>
        <button value="save" id="keysave" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="render.js"></script>
  <script src="app.js"></script>
</body>
</html>
